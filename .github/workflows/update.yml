name: Update F-Droid Repo

on:
  schedule:
    - cron: '0 */6 * * *' # Запуск каждые 6 часов
  workflow_dispatch:      # Возможность ручного запуска из вкладки Actions

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner openjdk-11-jdk
          pip install requests pyyaml fdroidserver

      - name: Restore F-Droid Config and Keystore
        env:
          CONFIG_YML: ${{ secrets.CONFIG_YML }}
          KEYSTORE_P12: ${{ secrets.KEYSTORE_P12 }}
        run: |
          mkdir -p fdroid
          echo "$CONFIG_YML" | base64 --decode > fdroid/config.yml
          echo "$KEYSTORE_P12" | base64 --decode > fdroid/keystore.p12

      - name: Sync and Update Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python sync_repos.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update F-Droid repository [skip ci]" && git push)
